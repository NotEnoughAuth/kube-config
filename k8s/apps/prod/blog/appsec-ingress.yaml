apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  namespace: blog
  annotations:
    # Set protection mode via annotation (detect-learn, prevent-learn, or off)
    openappsec.io/mode: "prevent-learn"
    
    # Force HTTPS redirection (equivalent to Traefik's websecure entrypoint behavior)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /ghost {
          return 404;
      }
spec:
  # Set to the ingress class configured in your open-appsec NGINX deployment
  ingressClassName: appsec-nginx 
  tls:
    - hosts:
        - blog.oplabs.us
      secretName: oplabs-us-tls
  rules:
    - host: blog.oplabs.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port: ghk8s