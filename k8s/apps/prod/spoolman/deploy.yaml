apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoolman-web
  namespace: spoolman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoolman-web
  template:
    metadata:
      labels:
        app: spoolman-web
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - spoolman-web
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: spoolman-web
          image: ghcr.io/donkie/spoolman:0.27.1
          # resources:
          #   limits:
          #     memory: "128Mi"
          #     cpu: "500m"
          ports:
            - containerPort: 8000
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SPOOLMAN_LOGGING_LEVEL
              value: "DEBUG"
            - name: SPOOLMAN_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: spoolman-db-secret
                  key: host
            - name: SPOOLMAN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spoolman-db-secret
                  key: username
            - name: SPOOLMAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoolman-db-secret
                  key: password
            - name: SPOOLMAN_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: spoolman-db-secret
                  key: database
            - name: SPOOLMAN_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: spoolman-db-secret
                  key: port
            - name: SPOOLMAN_DB_TYPE
              value: "postgres"