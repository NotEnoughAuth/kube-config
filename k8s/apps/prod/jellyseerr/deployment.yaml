apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      

      # 2. The Init Container runs first to prepare the certificate
      initContainers:
      - name: cert-downloader
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        # Downloads your custom cert and places it into the shared volume path
        args: 
          - |
            wget --no-check-certificate -O /usr/local/share/ca-certificates/OP-Labs-Root-CA.crt https://nexus.oplabs.us/repository/public-content/pki/OP-Labs-Root-CA.crt
        volumeMounts:
        - name: trusted-certs
          mountPath: /usr/local/share/ca-certificates
      containers:
        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr:v3.4.0
          ports:
            - containerPort: 5055
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-db-secret
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-db-secret
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-db-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-db-secret
                  key: password
            - name: DB_USE_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
            - name: LOG_LEVEL
              value: debug
            - name: TZ
              value: "America/Chicago"
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/local/share/ca-certificates/OP-Labs-Root-CA.crt
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: trusted-certs
              mountPath: /usr/local/share/ca-certificates
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
          podSecurityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            privileged: false
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
        - name: trusted-certs
          emptyDir: {}
