apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:+X2ia6TQH7dcG8umCb9T/Q==,iv:6/ontTDcDHSXRanH842yLOPSmwVnNodtKT27i8yCsX0=,tag:iRTVGEMURlGw/yGGlVpMNQ==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:ypQi1llfKFofA6aH+ECsDYjRMWE/6dwZrGCUj5GvxHmugRlyZK9iEtfMHOk2S+GMfZ0bHlmtQonahqT+ZbkZ7X+CWZrmxKXpQIjQ,iv:llBleJBCYRBR6rdAZI2SL38xLK0zED/hOIUkMyG8oLE=,tag:z6UQ20G/RiG9LGIxf7qDFw==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: false
