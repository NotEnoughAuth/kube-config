apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:UeLMlpD8k8kOexrKh4MJ/A==,iv:9h6FLtFnwRFPi7H9E+nEqFzSnUHQYwhJYAAtMpHJxWI=,tag:XWhLW9LCsC/GJ4MF/qDWMw==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:PQnGwRInWuv4cI3Ysmd8O/i+KtE6Xqyhy3yErcOZ6X7qa54jSJfQJGT7eUlcncs8RRg9CvHNC99a/R2l0iGWcsxDWYRUqRqevoRE,iv:hv28mQbfvObgnJpA1UYBqf/c4WQK5/xf1IZ1uEVb120=,tag:N7b+oAlOgjHymBgqLq4k/g==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                learning:
                    storageClass: ceph-filesystem
