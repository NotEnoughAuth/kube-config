apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:s6HD9tm57qGSyRrsw3Oudg==,iv:8pAABWghzAyDa89fMlQiYjT90huFbbChHVQHyitIM7Y=,tag:9+IwkvM97qSuaGl+mQOKxg==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:AZGjKu7bMD7pwOCub/EpOMNuytrD6bO+RFkueUfNBAfUJf0sxH9GPevIBPpK2FyP0bd/y2eNd7OGJgpwTSx214Od6moXrTDgNp5o,iv:NWVMfMGTJU2Prq+A2TaFyx1GWO64BNRYhoBTL/rL3u8=,tag:9TdPmz9P4ydGeLhBWzGzMA==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass:
                    name: ceph-filesystem
                    accessModes: ReadWriteMany
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass:
                        name: ceph-filesystem
                        accessModes: ReadWriteMany
