apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                    random: "true"
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:M1+J0VkMPaCyMRa+bEHGWQ==,iv:RbNRy1Hv1jbQ/63uh4ZESUZkowmGD34vKNCueK4A7YY=,tag:+16XUktntBCW4vpSSC2phw==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:fUzOBMrByJcQcO3GyqtX6Pibhj16D0GU7/NTbLz3YIrjjHrwNXEMWnKPgYLY7O3HuU63TyFnUhHrI4MtQHImh0yPziSk0EVubfcy,iv:kcMspCyNVRRJE3YbM2LCA4Q2feZxVusYZGhY9HFTsjE=,tag:qu4rtfjF0R4v7+9muWo+Eg==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                learning:
                    storageClass: ceph-filesystem
