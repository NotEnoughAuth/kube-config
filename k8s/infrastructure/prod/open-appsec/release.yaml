apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: appsec
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            config:
                worker-processes: "4"
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:1H/5ffWOI0Ep4FkuMVaTIQ==,iv:M9zF9wrniTO4b7DOfmq1Xw3aTj4Y+kRz197hzh+viLc=,tag:uZ96YOGbriWYouTXfhczSg==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:4+xw9cIThTnGv/IIPYOFlBNv8VneaqzzHAN8mSakwn9Z83la3WvFSHxryAol7tShWEUvqOrEgIaoq4CnEg1+OXX58v31WigOGdor,iv:4eo+xVVdzx/UPNJdfPxLSgNT/ag7SYcjJMzQ0ptwvOM=,tag:CNDDWqaV1yta8vJJ18FxTw==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-filesystem
                #     learning:
                #         # Set to true if persistent storage is available for ML learning
                #         storageClass:
                #             name: ceph-filesystem
                #             accessModes: ReadWriteMany
