apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:YyGbXZjgU99D23XsC9MXtw==,iv:U0y/0QA89qea2NvnjrCM1qGbdIhhBasl755Hv1MLH58=,tag:pCsJxPpd8aYqqEP85+2UeQ==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:cRLXeAY7tmBP3kRDjYYB3lkjwZ7Fqf/rpNJcP8UIdClMWsssHqPS0wXyCPYp992G/YojkRttO9LI238SOuQ+j+7dmY3YqdhOHeok,iv:LYdG3iQQot1+AuHzVxDJCjIpKNGjSCh2u1HlTX+h7XA=,tag:ijxmdKpEtTrWu9b7GWYDWQ==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-filesystem
                accessMode: ReadWriteMany
                learning:
                    enabled: true
                    # Set to true if persistent storage is available for ML learning
                    persistence:
                        enabled: true
                        storageClass: ceph-filesystem
                        accessMode: ReadWriteMany
