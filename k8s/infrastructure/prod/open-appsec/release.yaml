apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:ZltEeDI6yjKrc2pK4r1KKw==,iv:jPR7WHqEsOlOZzC65Oq9XpPc0Un/G/068WTa6oN5aAY=,tag:sX3Jgb39w9glqOdX+Pofjg==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:tL/szewWKTIwJV0mNyHktjz2lCZvDhs3kzAIHvqO2aTqLxX33bEISQYbVP866GItKgKnPWTtBnCkr3OXZGNMXnf8c0PsG0uniTEf,iv:4BCFpzJ7QYpjhubj/sDOC37qHK/cup2i+vTiMB12omo=,tag:wr1DANj+SWVqPJzYQZjutw==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                learning:
                    storageClass: ceph-block
