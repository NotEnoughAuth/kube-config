apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: appsec
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                    test: true
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:W00HepGANuPdXgDKULOVTg==,iv:lzDAAOxlsZFeMXetntpY2Q2BBhd52qN86w0xX3ODyEM=,tag:rhlS0ASCMPLRNySdq9vVvQ==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:+K4yH9CI7Li3O3oQABMQMNRMK4Pa+6FI3xndMUAXqhRVWYGNiyFhQrj+e1cbhRV49uHexlws1Z+d1lqbJ3doWwYdVEz3PmIjxukU,iv:LoXA+2CifM29VA2FlwOAaD+EhobYfDKkZH3fZjUGQ24=,tag:58n1TdFqIBasXfxVhGegwg==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-filesystem
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass:
                        name: ceph-filesystem
                        accessModes: ReadWriteMany
