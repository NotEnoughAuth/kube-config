apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:0VZXYKa+NkWi8QZeX6w9hA==,iv:0uZJXCWV3jMENrsxlMleXQ+OHMVSVGhrxwTT8lrrgfQ=,tag:i/jUGMkhuDQCV0VK098F1g==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:maN7njpAhqRtAKLcd2GL4tROwc1XlFp9YQhujYIZAilrtKNHUoDiM1igpI/bfUQJeb6s3rYzGk7UiZ/kyKwM/q+xBkGMRaYUKFqv,iv:OgoH8Sc0b1t265yyI8iXN090v1pdAZIyMaG7LEZ0l1I=,tag:7YnSzhQ3yZcGwbrENktafg==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: false
