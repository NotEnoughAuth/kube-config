apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:DzmxnokTrRVcFS9GyD+TUQ==,iv:WdKZ/LHMACQPrHljG+EqCQqz7va2HkjnjIUz7I5wjoo=,tag:03l0E81P3TNSexNUVL8H2g==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:WEWvAZv+LxEpo+SHw+Hj7ZZYlf1sVIJU5LZprUjDzKEHkGtlnczcGhcbppVhlreHKOHfOQydQkwOUHWmcqd3u09sCJHeOe29bgZG,iv:g4iyRXDSWkTYkzR4C2vX0sGTj4/6ROWyqtwDRp5J0go=,tag:zmS+VXYBEcPsC3DJG3SNhw==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: false
                storageClass: ceph-filesystem
                accessMode: ReadWriteMany
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass: ceph-filesystem
                    accessMode: ReadWriteMany
