            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:sYL572f5G8URHe3nfwCc9NoX6G4wwdw38fef4ZjknB5sTQ9Ev4u8/wFeMkxJ49utqbceAFb6tQnqgvvXy0kYwjNuo6UkUFcjRsTJ,iv:x75kn2QbaohgiwxfoH+5rE6ZHrq1Pb3r/xvbKWODgD4=,tag:1wbClEQmkV2Ez0GOjhfcyA==,type:str]
