apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                    random: "true"
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:B3jPwf7DRZP/UZ246yssMQ==,iv:pp1KbmSZJxMspMFgVThKbkIaPxjpwRrDQ2p4ttZWM4Y=,tag:jHVnv6StzQKldCnAod76cQ==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:T9vEKRXeOiUT9kYe0XFs5Xti/v0PeO2hidgnl+foULQ/M73Tf6tNGiUaP9biIfWwEhzdIjIBKZTAJFKMwmvWeuy6Lv1zgu1BVdiJ,iv:7YAaCUQgzsDdmkh5zLjjNk1uPskb5xYuj08/reAfdE0=,tag:cOmxnqlLd2O7JJuKT9RdhQ==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-filesystem
                accessMode: ReadWriteMany
                learning:
                    enabled: true
                    # Set to true if persistent storage is available for ML learning
                    persistence:
                        enabled: true
                        storageClass: ceph-filesystem
                        accessMode: ReadWriteMany
