apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: flux-system
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                spec:
                    externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:nMTi/4wsGS10bdaT9phq/A==,iv:MvnDfAzw9x8UmII3eDdWnFs3OAar7dqwPDmQkGjzzeI=,tag:eqbCZeEsgD45+KIfND8jkg==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:TcINK0TGdVctbK/TqbwW+mF2xA9UupGB785m8NzXlJL0V9s0KMkfefGk64T1XrTQt/qJEHfeIzJ19JD1b1JbgXQ5UKCIUPZzwzrP,iv:XP5ERd562TxvdZChSoDaWJak8V365MDkrihY+gRnTQA=,tag:zz6uVE9v3G7blcLP3q6iCw==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-filesystem
                accessMode: ReadWriteMany
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass: ceph-filesystem
                    accessMode: ReadWriteMany
