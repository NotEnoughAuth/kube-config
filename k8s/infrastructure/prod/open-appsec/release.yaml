apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: appsec
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            config:
                worker-processes: "4"
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:YZGd3a2GZqvxliP5txCbjA==,iv:+pYDQRABE564XF0kDTx7ZzzFxdDXdUzGr+VELAQCMJI=,tag:EeVvUZ4MvcMkrdxHdbIkxQ==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:aIn1kRsozEJK1lXmXyabOG5QpcvivsgtV6PSB8nudeCr8bc63an3y20e10TeZ50MHw+kGpmvYgJQRNGz3QwMMqpN8PGgWuuK6hEP,iv:H5zKcltJdb9FamvA15TZn/STFbXeQ4yp4ztOdAbmibQ=,tag:B88oX//fyMrZuDPz6BTnEQ==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-block
                accessModes:
                    - ReadWriteOnce
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass:
                        name: ceph-filesystem
                        accessModes: ReadWriteMany
