apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: open-appsec-nginx
    namespace: appsec
spec:
    interval: 30m
    releaseName: open-appsec-nginx
    targetNamespace: appsec
    install:
        createNamespace: true
    chart:
        spec:
            chart: open-appsec-nginx-ingress
            version: '>=0.1.0' # Specify your desired chart version
            sourceRef:
                kind: HelmRepository
                name: open-appsec
                namespace: flux-system
    values:
        fullnameOverride: appsec-nx
        nameOverride: appsec-nx
        controller:
            ingressClass: appsec-nginx
            ingressClassResource:
                name: appsec-nginx
                controllerValue: k8s.io/appsec-nginx
            service:
                labels:
                    scope: public
                annotations:
                    lbipam.cilium.io/ips: 10.27.55.20
                externalTrafficPolicy: Local
                type: LoadBalancer
            replicaCount: 3
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            labelSelector:
                                matchExpressions:
                                    - key: app.kubernetes.io/name
                                      operator: In
                                      values:
                                        - open-appsec-nginx-ingress-controller
                            topologyKey: kubernetes.io/hostname
        appsec:
            # Use 'managed' if connecting to open-appsec SaaS portal
            mode: managed
            # Required if connecting to SaaS
            userEmail: ENC[AES256_GCM,data:sBdLbZRhfMpCcaIDD8UFcw==,iv:0kP34eX/FnjLBJK1SQMoCudZB8ss/zbXr5O1G1k5MNk=,tag:/wSOwo/jkbd5LNqWS8E51g==,type:str]
            # Provided by open-appsec portal if using managed mode
            agentToken: ENC[AES256_GCM,data:q7HXReZZMHtfl6VhOtqDNrqeXljpxHZvzUxXqYK8Me6OLQaMfan8XmdtBd0U8Fy0/ib8+/pd7U3E7aIK4sZqk/nicy+s4sMVfH1v,iv:A9f5pOtPlJfCufKl7EoWRR4Gtj3EvjE4mtIyIoyH2iQ=,tag:kS21cz6vtu1ZC2zyyrijMQ==,type:str]
            persistence:
                # Set to true if persistent storage is available for ML learning
                enabled: true
                storageClass: ceph-block
                accessModes:
                    - ReadWriteOnce
                learning:
                    # Set to true if persistent storage is available for ML learning
                    storageClass:
                        name: ceph-filesystem
                        accessModes: ReadWriteMany
